# CoreX Agent Hub — katalog yapılandırması
#
# KAPSAM: Faz 1 katalog kavramları (Organization / Project / Repository /
# VerificationProfile / AgentProfile). Sonraki fazlara ait runtime ayarları burada YOKTUR.
#
# Bu dosya yerel geliştirme/fixture değerleri ile Hub'ın KENDİ repository'sini içerir.
#   - Core X Logic organizasyonu agent-hub projesini (G6-3) ve talep-takip pilotunu içerir
#   - Başka gerçek Core X Logic ürün repository'si YOK (Nakliye360 / Kariora YOK)
#   - Gerçek Kronos verisi YOK  (bkz. ADR-0017)
#   - Sır / token / kimlik bilgisi YOK
#
# Seed politikası (bkz. docs/../README.md "Yapılandırma"):
#   additive-upsert — doğal anahtara göre ekler/günceller, HİÇBİR ZAMAN silmez.

schemaVersion: 1

workspace:
  # ADR-0004 / Faz 0 onaylı format kararları
  root: 'D:\cx'
  fixtureRoot: 'D:\cx\_fixtures'

# Makine doğrulaması (Faz 4). Katalog DEĞİLDİR: veritabanına yazılmaz.
verification:
  # Mantiksal ad -> mutlak calistirilabilir yolu. Bir verification adimi YALNIZCA burada
  # gecen bir anahtari kullanabilir; PATH'e guvenilmez, arac calisma zamaninda aranmaz.
  executables:
    dotnet: 'C:\Program Files\dotnet\dotnet.exe'
    dotnet-ef: 'C:\Users\krono\.dotnet\tools\dotnet-ef.exe'

# Agent calisma zamanlari (Faz 5+). Katalog DEĞİLDİR: veritabanina yazilmaz.
#
# Katalog hangi runtimeKey'in kullanilacagini soyler; burasi o anahtarin ARKASINDA bu
# makinede ne durdugunu soyler. Sir/token/anahtar YOKTUR: kimlik dogrulama bant disidir
# (ADR-0009) ve arac yuzeyi ile izin modu adapterde dondurulmustur (ADR-0020).
agents:
  claudeCodeRuntimes:
    - key: claude-code
      executablePath: 'C:\Users\krono\.local\bin\claude.exe'

  # Codex SABITLENMIS bir surume baglidir. Bu saglayicinin review'un dayandigi davranisi
  # surumler arasinda iki yonde de degisti (G8-2 / G8-2B / G8-2C olcumleri), bu yuzden
  # "kurulu olan bir Codex" kullanilabilir bir gercek degildir. PATH'e bakilmaz: bu makinede
  # global olarak 0.149.1 kurulu ve o surum reviewer olarak KABUL EDILMEDI.
  codexRuntimes:
    - key: codex-reviewer-runtime
      executablePath: 'D:\cx\_tools\codex-0.130.0\node_modules\@openai\codex-win32-x64\vendor\x86_64-pc-windows-msvc\codex\codex.exe'
      acceptedVersion: '0.130.0'

organizations:

  # --- Core X Logic: Hub'ın kendi repository'si (G6-3) ----------------------
  # Gerçek katalog girdisidir. Faz 6 gerçek agent kabulünün hedefi budur; yanında
  # yalnızca talep-takip pilotu vardır.
  - slug: core-x-logic
    name: Core X Logic
    filesystemRoot: 'D:\Private\Cafer AYDIN'
    isolationLevel: Logical
    requiresHardIsolation: false

    # ADR-0007: bu organizasyona ait HER yönetilen alt süreç (agent ve doğrulama)
    # boş ortamdan başlar ve YALNIZCA bunları miras alır.
    #
    # Liste iki tüketicinin birleşimidir:
    #   - agent: USERPROFILE, aracın zaten açık olan iş istasyonu oturumunu bulması
    #     için gereklidir (ADR-0009);
    #   - doğrulama: NuGet geri yükleme, kullanıcı yapılandırması için APPDATA ve
    #     makine yapılandırması için ProgramFiles/ProgramFiles(x86) ister. Bunlar
    #     olmadan `dotnet restore` "Value cannot be null. (Parameter 'path1')" ile
    #     düşer. Ölçüldü, varsayılmadı.
    #
    # ClaudeCodeRuntime kendi tavanına daraltır: agent alt süreci bu listenin
    # yalnızca kendi ihtiyaç duyduğu alt kümesini görür.
    #
    # Sağlayıcı anahtarı / uç noktası / ana süreç oturumu değişkenleri BURADA YOKTUR
    # ve runtime tarafından ayrıca reddedilir.
    environmentAllowlist:
      - SystemRoot
      - windir
      - SystemDrive
      - PATH
      - PATHEXT
      - TEMP
      - TMP
      - USERPROFILE
      - APPDATA
      - LOCALAPPDATA
      - ProgramFiles
      - ProgramFiles(x86)
      - NUMBER_OF_PROCESSORS

    agentProfiles:
      - name: claude-implementer
        role: Implementer
        provider: ClaudeCode
        runtimeKey: claude-code
        permissionProfile: WorkspaceWrite
        model: claude-opus-5
        effort: high
        softTimeoutSeconds: 1800
        idleTimeoutSeconds: 2400
        hardTimeoutSeconds: 3600

      # Bagimsiz gozden gecirici. Ayni runtime anahtari, farkli izin profili:
      # ReadOnly, runtime tarafinda Read/Glob/Grep + plan izin moduna cevrilir.
      # Faz 8'de Codex'e gecis YALNIZCA bu profili degistirmekle olur.
      - name: claude-reviewer
        role: Reviewer
        provider: ClaudeCode
        runtimeKey: claude-code
        permissionProfile: ReadOnly
        model: claude-opus-5
        effort: high
        softTimeoutSeconds: 900
        idleTimeoutSeconds: 1200
        hardTimeoutSeconds: 1800

      # Faz 8A: profil VAR ama ETKIN DEGIL. Repository hala claude-reviewer'i gosteriyor;
      # gecis Faz 8B'nin isidir. Profilin varligi tek basina review yoluna girmez.
      #
      # Model gpt-5.5 bilerek secildi: olculdu ki gpt-5.6-sol code_mode_only + multi_agent
      # yuzeyini zorunlu kiliyor, gpt-5.5 ise Direct Mode ve multi-agent araci sunmuyor.
      - name: codex-reviewer
        role: Reviewer
        provider: Codex
        runtimeKey: codex-reviewer-runtime
        permissionProfile: ReadOnly
        model: gpt-5.5
        effort: high
        softTimeoutSeconds: 900
        idleTimeoutSeconds: 1200
        hardTimeoutSeconds: 1800

    projects:
      - slug: agent-hub
        name: CoreX Agent Hub
        taskKeyPrefix: CXH
        repositories:
          - slug: corex-agent-hub
            name: corex-agent-hub
            localPath: 'D:\Private\Cafer AYDIN\CorexLogic\Projeler\Core X Agent Hub'
            defaultBranch: main
            protectedBranches:
              - main

            # Hangi profilin gozden gecirdigini KATALOG soyler, kod degil.
            reviewerProfile: codex-reviewer
            verificationProfiles:
              - name: hub-release-full
                isDefault: true
                workingDirectory: '.'
                steps:
                  - name: restore
                    executable: dotnet
                    args: ['restore', 'CoreX.Hub.slnx']
                    timeoutSeconds: 600
                    required: true
                    resultParser: none

                  # -warnaserror is mechanical: exit code alone does not prove a
                  # warning-free build, and "no warnings" is only true if the compiler
                  # was told to treat one as a failure.
                  - name: build
                    executable: dotnet
                    args:
                      - 'build'
                      - 'CoreX.Hub.slnx'
                      - '-c'
                      - 'Release'
                      - '--no-restore'
                      - '-warnaserror'
                    timeoutSeconds: 1200
                    required: true
                    resultParser: none

                  # Cozumun TAMAMI icin tek adim, ve bilerek parser'siz.
                  #
                  # `dotnet test <solution>` her test projesi icin AYRI bir test host
                  # calistirir ve hepsi ayni `--logger trx;LogFileName=` dosyasina yazar;
                  # sonuncusu digerlerinin uzerine yazar. Olculdu: cozumde ~1000+ test
                  # varken dosyada yalnizca 117 sonuc kaldi.
                  #
                  # Parser'i acik birakmak, "test adimi gecti, 117 test" gibi YANLIS bir
                  # makine kaniti uretirdi. Adimin cikis kodu ise cozumun tamami icin
                  # dogrudur: herhangi bir proje duserse `dotnet test` sifirdan farkli
                  # doner. Bu yuzden otorite cikis kodudur ve sayac hic iddia edilmez.
                  #
                  # Proje basina sayac gerekirse dogru bicim proje basina adimdir; tek
                  # dosyaya yazan cozum-genisi bir adim degil.
                  - name: test
                    executable: dotnet
                    args:
                      - 'test'
                      - 'CoreX.Hub.slnx'
                      - '-c'
                      - 'Release'
                      - '--no-build'
                    timeoutSeconds: 3600
                    required: true
                    resultParser: none

                  # The model and the migrations must agree. A drifted model is a
                  # silent production failure, so it is a required machine check.
                  - name: ef-pending-model
                    executable: dotnet-ef
                    args:
                      - 'migrations'
                      - 'has-pending-model-changes'
                      - '--project'
                      - 'src/CoreX.Hub.Infrastructure'
                      - '--startup-project'
                      - 'src/CoreX.Hub.Cli'
                      - '--no-build'
                      - '--configuration'
                      - 'Release'
                    timeoutSeconds: 600
                    required: true
                    resultParser: none

      # Pilot: agent'larla sifirdan gelistirilen deneme projesi. Onemli urun
      # repolarina (ERP, Nakliye, Teknik Servis) gecmeden once calisma bicimi burada
      # denenir. Gercek sirket/musteri verisi icermez.
      - slug: talep-takip
        name: Core X Talep Takip
        taskKeyPrefix: TT
        repositories:
          - slug: talep-takip
            name: talep-takip
            localPath: 'D:\Private\Cafer AYDIN\CorexLogic\Projeler\Core X Talep Takip'
            defaultBranch: main
            protectedBranches:
              - main
            reviewerProfile: codex-reviewer
            verificationProfiles:
              - name: dotnet-release
                isDefault: true
                workingDirectory: '.'
                steps:
                  - name: restore
                    executable: dotnet
                    args: ['restore', 'TalepTakip.slnx']
                    timeoutSeconds: 600
                    required: true
                    resultParser: none
                  - name: build
                    executable: dotnet
                    args:
                      - 'build'
                      - 'TalepTakip.slnx'
                      - '-c'
                      - 'Release'
                      - '--no-restore'
                      - '-warnaserror'
                    timeoutSeconds: 900
                    required: true
                    resultParser: none

                  # Tek test projesi, tek TRX: sayaclar bu yuzden dogrudur. Ikinci bir
                  # test projesi eklenirse ona ayri bir adim gerekir (bkz. hub-release-full).
                  - name: test
                    executable: dotnet
                    args:
                      - 'test'
                      - 'tests/TalepTakip.Tests/TalepTakip.Tests.csproj'
                      - '-c'
                      - 'Release'
                      - '--no-build'
                      - '--logger'
                      - 'trx;LogFileName=results.trx'
                      - '--results-directory'
                      - 'results'
                    timeoutSeconds: 1200
                    required: true
                    resultParser: trx
                    resultPath: 'results/results.trx'

  # --- Geliştirme / Loop Zero fixture organizasyonu -------------------------
  # Yalnızca katalog örneğidir. Loop Zero ve e2e takımları kendi geçici config'lerini ve
  # fixture repolarını üretir; bu makinede 'D:\cx\_fixtures' altında bir repo YOKTUR ve
  # 'scripted' runtimeKey'i agents.scriptedRuntimes altında bildirilmemiştir. Bu organizasyonda
  # 'hub run' için ikisinin de kurulması gerekir.
  - slug: hub-dev
    name: CoreX Agent Hub Development
    filesystemRoot: 'D:\cx\_fixtures\hub-dev'
    isolationLevel: Logical
    requiresHardIsolation: false
    environmentAllowlist:
      - PATH
      - SystemRoot
      - TEMP
      - TMP
      - USERPROFILE

    agentProfiles:
      - name: scripted-implementer
        role: Implementer
        provider: Scripted
        runtimeKey: scripted
        permissionProfile: WorkspaceWrite
        softTimeoutSeconds: 300
        idleTimeoutSeconds: 600
        hardTimeoutSeconds: 1800
      - name: scripted-reviewer
        role: Reviewer
        provider: Scripted
        runtimeKey: scripted
        permissionProfile: ReadOnly
        softTimeoutSeconds: 300
        idleTimeoutSeconds: 600
        hardTimeoutSeconds: 1800

    projects:
      - slug: hub-sample
        name: Hub Sample Fixture
        taskKeyPrefix: HUB
        repositories:
          - slug: hub-sample-repo
            name: hub-sample
            localPath: 'D:\cx\_fixtures\hub-dev\hub-sample'
            defaultBranch: main
            protectedBranches:
              - main
              - master
            verificationProfiles:
              - name: dotnet-default
                isDefault: true
                workingDirectory: '.'
                steps:
                  - name: restore
                    executable: dotnet
                    args: ['restore']
                    timeoutSeconds: 300
                    required: true
                    resultParser: none
                  - name: build
                    executable: dotnet
                    args: ['build', '--no-restore']
                    timeoutSeconds: 600
                    required: true
                    resultParser: none
                  - name: test
                    executable: dotnet
                    args:
                      - 'test'
                      - '--no-build'
                      - '--logger'
                      - 'trx;LogFileName=results.trx'
                      - '--results-directory'
                      - 'results'
                    timeoutSeconds: 1800
                    required: true
                    resultParser: trx
                    resultPath: 'results/results.trx'

  # --- Sert izolasyon kapısı fixture'ı (ADR-0017 davranışını görünür kılar) --
  # Gerçek bir şirket DEĞİLDİR. Yalnızca kapı davranışının CLI'da gözlemlenmesi içindir.
  # Repository yolu bu makinede yoktur ve kullanılmaz: organizasyon Blocked yüklenir, hiçbir
  # execution başlatamaz.
  - slug: isolation-gate-fixture
    name: Hard Isolation Gate Fixture
    filesystemRoot: 'D:\cx\_fixtures\isolation-gate-fixture'
    isolationLevel: Logical
    requiresHardIsolation: true
    environmentAllowlist:
      - PATH
      - SystemRoot
    agentProfiles: []
    projects:
      - slug: gate-sample
        name: Gate Sample Fixture
        taskKeyPrefix: GATE
        repositories:
          - slug: gate-sample-repo
            name: gate-sample
            localPath: 'D:\cx\_fixtures\isolation-gate-fixture\gate-sample'
            defaultBranch: main
            protectedBranches:
              - main
            verificationProfiles:
              - name: noop
                isDefault: true
                workingDirectory: '.'
                steps:
                  - name: build
                    executable: dotnet
                    args: ['build']
                    timeoutSeconds: 300
                    required: true
                    resultParser: none
